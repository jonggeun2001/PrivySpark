rules:
  - pii_type: phone_number
    regex: '(?<![0-9])(?:01[016789]|\+82-?1[016789])-?[0-9]{3,4}-?[0-9]{4}(?![0-9])'
  - pii_type: email
    regex: '(?<![A-Za-z0-9_%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:[.][A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*[.][A-Za-z]{2,}(?![A-Za-z0-9_%+-])'
  - pii_type: resident_registration_number
    regex: '(?<![0-9])[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])(?:-[1-4](?:[0-9]{6})?|[1-4](?:[0-9]{6})?)(?![0-9])'
  - pii_type: foreign_registration_number
    regex: '(?<![0-9])[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])(?:-[5-8][0-9]{6}|[5-8][0-9]{6})(?![0-9])'
  - pii_type: driver_license_number
    regex: '(?:(?<![0-9-])(?:[0-9]{2}-[0-9]{6}-[0-9]{2}|(?:1[1-9]|2[0-6]|28)-[0-9]{2}-[0-9]{6}-[0-9]{2}|(?:1[1-9]|2[0-6]|28)[0-9]{10})(?![0-9])|(?<![가-힣A-Za-z0-9])(?:서울|부산|경기|강원|충북|충남|전북|전남|경북|경남|제주|대구|인천|광주|대전|울산)\s*(?:[0-9]{10}|[0-9]{2}\s*-\s*[0-9]{6}\s*-\s*[0-9]{2})(?![가-힣A-Za-z0-9]))'
  - pii_type: address
    regex: '[가-힣0-9\- ]+(시|도) [가-힣0-9\- ]+(구|군|시) [가-힣0-9\- ]+(로|길) [0-9\-]+'
  - pii_type: bank_account_number
    regex: '(?<![0-9])(?:[0-9]{2,3}-[0-9]{2,6}-[0-9]{2,6}|[0-9]{4}-[0-9]{3,6}-[0-9]{2,6})(?![0-9])'
  - pii_type: credit_card_number
    regex: '(?<![0-9])(?:4[0-9]{3}|5[1-5][0-9]{2}|2(?:2(?:2[1-9]|[3-9][0-9])|[3-6][0-9]{2}|7(?:0[0-9]|1[0-9]|20))|6(?:011|5[0-9]{2})|35(?:2[89]|[3-8][0-9]))(?:-?[0-9]{4}){3}(?![0-9])'
  - pii_type: passport_number
    regex: '(?<![A-Za-z0-9])[MSROD](?!0{8})[0-9]{8}(?![A-Za-z0-9])'
  - pii_type: ip_address
    regex: '(?<![0-9.])(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])(?:[.](?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){3}(?![0-9]|[.][0-9])'
