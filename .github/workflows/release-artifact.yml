name: Release Artifact

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release assets
        run: |
          for attempt in 1 2 3; do
            if ./gradlew clean shadowJar packageSampleDatasets; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Release asset build failed on attempt ${attempt}; retrying..." >&2
              sleep $((attempt * 10))
            fi
          done
          echo "Release asset build failed after 3 attempts." >&2
          exit 1

      - name: Resolve release tag
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: assets
        run: |
          shopt -s nullglob
          jars=(build/libs/*-all.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one shadow jar in build/libs, found: ${#jars[@]}" >&2
            exit 1
          fi

          asset_jar="build/libs/privyspark-${{ steps.meta.outputs.tag }}-all.jar"
          if [ "${jars[0]}" != "$asset_jar" ]; then
            cp "${jars[0]}" "$asset_jar"
          fi
          asset_rules="build/libs/default-rules.yaml"
          cp config/rules/default.yaml "$asset_rules"
          sha256sum "$asset_jar" > "${asset_jar}.sha256"
          sample_zip="build/distributions/privyspark-sample-datasets.zip"
          if [ ! -f "$sample_zip" ]; then
            echo "Expected sample dataset archive at $sample_zip" >&2
            exit 1
          fi
          asset_sample_zip="build/distributions/privyspark-${{ steps.meta.outputs.tag }}-sample-datasets.zip"
          if [ "$sample_zip" != "$asset_sample_zip" ]; then
            cp "$sample_zip" "$asset_sample_zip"
          fi
          review_response_example="samples/offline-review/review-response-example.html"
          if [ ! -f "$review_response_example" ]; then
            echo "Expected offline review response example at $review_response_example" >&2
            exit 1
          fi
          asset_review_response_example="build/distributions/privyspark-${{ steps.meta.outputs.tag }}-review-response-example.html"
          cp "$review_response_example" "$asset_review_response_example"
          review_response_viewer="samples/offline-review/review-response-viewer.html"
          if [ ! -f "$review_response_viewer" ]; then
            echo "Expected offline review response viewer at $review_response_viewer" >&2
            exit 1
          fi
          asset_review_response_viewer="build/distributions/privyspark-${{ steps.meta.outputs.tag }}-review-response-viewer.html"
          cp "$review_response_viewer" "$asset_review_response_viewer"

          echo "asset_jar=$asset_jar" >> "$GITHUB_OUTPUT"
          echo "asset_sha=${asset_jar}.sha256" >> "$GITHUB_OUTPUT"
          echo "asset_rules=$asset_rules" >> "$GITHUB_OUTPUT"
          echo "asset_sample_zip=$asset_sample_zip" >> "$GITHUB_OUTPUT"
          echo "asset_review_response_example=$asset_review_response_example" >> "$GITHUB_OUTPUT"
          echo "asset_review_response_viewer=$asset_review_response_viewer" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privyspark-${{ steps.meta.outputs.tag }}
          path: |
            ${{ steps.assets.outputs.asset_jar }}
            ${{ steps.assets.outputs.asset_sha }}
            ${{ steps.assets.outputs.asset_rules }}
            ${{ steps.assets.outputs.asset_sample_zip }}
            ${{ steps.assets.outputs.asset_review_response_example }}
            ${{ steps.assets.outputs.asset_review_response_viewer }}

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.commit_sha }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.asset_jar }}
            ${{ steps.assets.outputs.asset_sha }}
            ${{ steps.assets.outputs.asset_rules }}
            ${{ steps.assets.outputs.asset_sample_zip }}
            ${{ steps.assets.outputs.asset_review_response_example }}
            ${{ steps.assets.outputs.asset_review_response_viewer }}
          fail_on_unmatched_files: true
